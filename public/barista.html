<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mars Cafe — Barista Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C8A96E;
      --gold-light: #E2C99A;
      --dark: #1C1C1C;
      --bg: #F7F4EF;
      --border: rgba(0,0,0,0.1);
      --text-muted: rgba(0,0,0,0.45);
    }

    body {
      font-family: 'Cinzel', serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
      max-width: 440px;
      margin: 0 auto;
    }

    .logo-svg { width: 160px; max-width: 60vw; display: block; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .header-logo { display: flex; align-items: center; }
    .header-role {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Section */
    .section {
      background: white;
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.6);
      margin-bottom: 1rem;
    }

    /* Scanner */
    #scanner-container {
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #html5-qrcode-button-camera-stop,
    #html5-qrcode-button-camera-start { display: none !important; }

    .scan-btn {
      width: 100%;
      padding: 13px;
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: opacity 0.2s;
    }
    .scan-btn:hover { opacity: 0.85; }
    .scan-btn.scanning { background: #555; }

    /* Manual input */
    .manual-row {
      display: flex;
      gap: 8px;
    }
    .manual-row input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 1px;
      background: var(--bg);
      outline: none;
      letter-spacing: 1px;
    }
    .manual-row input:focus { border-color: var(--gold); }
    .manual-row button {
      padding: 11px 18px;
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* Customer card */
    .customer-card {
      display: none;
      animation: slideUp 0.3s ease;
    }
    .customer-card.visible { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .c-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .c-id-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px; color: rgba(0,0,0,0.55); text-transform: uppercase; margin-bottom: 4px; }
    .c-id-value { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 600; letter-spacing: 1px; color: var(--dark); }
    .c-cups-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px; color: rgba(0,0,0,0.55); text-transform: uppercase; margin-bottom: 4px; text-align: right; }
    .c-cups-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; text-align: right; line-height: 1; font-weight: 400; }

    .stars-mini { display: none; }

    .add-btn {
      width: 100%;
      padding: 14px;
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .add-btn:hover { opacity: 0.85; }
    .add-btn.gift {
      background: var(--gold);
      color: var(--dark);
      font-size: 16px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }

    /* Register */
    .reg-section {
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(200,169,110,0.12);
      color: var(--gold);
      font-size: 11px;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(200,169,110,0.3);
    }
    .reg-note { font-family: 'Cinzel', serif; font-size: 10px; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.8; letter-spacing: 0.3px; }
    .reg-btn {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: var(--dark);
      border: 1.5px solid var(--dark);
      border-radius: 12px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reg-btn:hover { background: var(--dark); color: white; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--dark);
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #2d6a4f; }
    .toast.error { background: #c0392b; }
    .toast.warning { background: #b7791f; }
  
    .reg-qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .reg-qr-wrap canvas { border-radius: 8px; }
    .reg-qr-note {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
    }
</style>
</head>
<body>

  <!-- PIN SCREEN -->
  <div id="pin-screen" class="pin-screen">
    <div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:4px;color:rgba(0,0,0,0.4);text-transform:uppercase;text-align:center;margin-bottom:2rem;">Barista Girişi</div>
    <div style="display:flex;gap:16px;justify-content:center;margin-bottom:2rem;" id="pin-dots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <div style="display:grid;grid-template-columns:repeat(3,80px);gap:14px;justify-content:center;margin-bottom:1rem;">
      <button onclick="pinPress('1')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">1</button>
      <button onclick="pinPress('2')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">2</button>
      <button onclick="pinPress('3')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">3</button>
      <button onclick="pinPress('4')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">4</button>
      <button onclick="pinPress('5')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">5</button>
      <button onclick="pinPress('6')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">6</button>
      <button onclick="pinPress('7')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">7</button>
      <button onclick="pinPress('8')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">8</button>
      <button onclick="pinPress('9')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">9</button>
      <div style="width:80px;height:80px;"></div>
      <button onclick="pinPress('0')" style="width:80px;height:80px;border-radius:50%;border:none;background:white;font-family:'Cormorant Garamond',serif;font-size:32px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;">0</button>
      <button onclick="pinDelete()" style="width:80px;height:80px;border-radius:50%;border:none;background:transparent;font-size:24px;color:#1a1a1a;cursor:pointer;">⌫</button>
    </div>
  </div>

    <div class="header-role">Barista Paneli</div>
  </div>

  <!-- SCANNER -->
  <div class="section">
    <div class="section-title">QR Tara</div>
    <div id="scanner-container">
      <div style="color:rgba(255,255,255,0.3);font-size:13px">Kamera başlatılıyor...</div>
    </div>
    <button class="scan-btn" id="scan-toggle" onclick="toggleScanner()">
      <i class="ti ti-camera"></i> Kamerayı Aç
    </button>
  </div>

  <!-- MANUAL INPUT -->
  <div class="section">
    <div class="section-title">Manuel ID Gir</div>
    <div class="manual-row">
      <input type="text" id="manual-id" placeholder="a7f3c2d1" maxlength="8" />
      <button onclick="lookupById()">Bul</button>
    </div>
  </div>

  <!-- CUSTOMER RESULT -->
  <div class="section customer-card" id="customer-card">
    <div class="section-title">Müşteri Bulundu</div>
    <div class="c-header">
      <div>
        <div class="c-id-label">ID</div>
        <div class="c-id-value" id="c-id">—</div>
      </div>
      <div>
        <div class="c-cups-label">Fincan</div>
        <div class="c-cups-value" id="c-cups">—</div>
      </div>
    </div>
    <div class="stars-mini" id="c-stars"></div>
    <button class="add-btn" id="add-btn" onclick="addCup()">
      <i class="ti ti-coffee"></i> Fincan Ekle
    </button>
  </div>

  <!-- REGISTER: show QR for customer to scan -->
  <div class="section">
    <div class="section-title">Yeni Müşteri</div>
    <div class="reg-qr-wrap">
      <div id="reg-qrcode"></div>
      <div class="reg-qr-note">
        Müşteriye bu QR'ı göster.<br>
        Telefonu ile tarasın, kartı kendisi oluştursun.
      </div>
    </div>
  </div>

  </div><!-- end barista-panel -->

  <div class="toast" id="toast"></div>

  <script>
    const TOTAL = 8;
    let currentCustomer = null;
    let scanner = null;
    let scannerActive = false;


    // ── PIN System ───────────────────────────────────────────────────────────
    let pinValue = '';
    let baristaName = '';
    let baristaPin = '';

    function pinPress(digit) {
      if (pinValue.length >= 4) return;
      pinValue += digit;
      updateDots();
      if (pinValue.length === 4) {
        setTimeout(verifyPin, 150);
      }
    }

    function pinDelete() {
      pinValue = pinValue.slice(0, -1);
      updateDots();
      document.getElementById('pin-error').textContent = '';
    }

    function updateDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((d, i) => {
        d.classList.toggle('filled', i < pinValue.length);
      });
    }

    async function verifyPin() {
      try {
        const res = await fetch('/api/barista/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pinValue })
        });
        const data = await res.json();
        if (res.ok) {
          baristaName = data.name;
          baristaPin = pinValue;
          document.getElementById('pin-screen').style.display = 'none';
          document.getElementById('barista-panel').style.display = 'block';
          // Generate reg QR
          new QRCode(document.getElementById('reg-qrcode'), {
            text: window.location.origin + '/',
            width: 140, height: 140,
            colorDark: '#1a1a1a', colorLight: '#ffffff',
          });
          showToast('Hoş geldin, ' + baristaName + '! 👋', 'success');
        } else {
          document.getElementById('pin-error').textContent = data.error || 'Geçersiz PIN';
          pinValue = '';
          updateDots();
        }
      } catch {
        document.getElementById('pin-error').textContent = 'Bağlantı hatası';
        pinValue = '';
        updateDots();
      }
    }

    // ── Scanner ──────────────────────────────────────────────────────────────
    function toggleScanner() {
      if (scannerActive) {
        stopScanner();
      } else {
        startScanner();
      }
    }

    function startScanner() {
      const btn = document.getElementById('scan-toggle');
      btn.textContent = '⏹ Kamerayı Kapat';
      btn.classList.add('scanning');
      scannerActive = true;

      scanner = new Html5Qrcode('scanner-container');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decoded) => {
          // Extract customer ID from URL or use raw value
          const parts = decoded.split('/');
          const id = parts[parts.length - 1];
          stopScanner();
          lookupCustomer(id);
        },
        () => {}
      ).catch(() => {
        showToast('Kamera açılamadı', 'error');
        stopScanner();
      });
    }

    function stopScanner() {
      if (scanner) scanner.stop().catch(() => {});
      scannerActive = false;
      const btn = document.getElementById('scan-toggle');
      btn.textContent = '📷 Kamerayı Aç';
      btn.classList.remove('scanning');
    }

    // ── Lookup ───────────────────────────────────────────────────────────────
    function lookupById() {
      const id = document.getElementById('manual-id').value.trim();
      if (!id) return showToast('ID gir', 'warning');
      lookupCustomer(id);
    }

    async function lookupCustomer(id) {
      try {
        const res = await fetch(`/api/customer/${id}`);
        if (!res.ok) return showToast('Müşteri bulunamadı', 'error');
        const data = await res.json();
        currentCustomer = data;
        renderCustomer(data);
        showToast('Müşteri bulundu ✓', 'success');
      } catch {
        showToast('Bağlantı hatası', 'error');
      }
    }

    function renderCustomer(data) {
      document.getElementById('c-id').textContent = data.id;
      const shown = Math.min(data.cups, 7);
      document.getElementById('c-cups').textContent = Math.min(data.cups, 7) + ' / 7';

      const stars = document.getElementById('c-stars');
      stars.innerHTML = '';
      for (let i = 1; i <= TOTAL; i++) {
        const s = document.createElement('span');
        if (i === TOTAL) {
          s.className = 'sm ' + (data.cups >= TOTAL ? 'ge' : 'gw');
          s.textContent = '🎁';
        } else {
          s.className = 'sm ' + (i <= data.cups ? 'f' : 'e');
          s.textContent = '☕';
        }
        stars.appendChild(s);
      }

      const btn = document.getElementById('add-btn');
      if (data.cups >= TOTAL) {
        btn.className = 'add-btn gift';
        btn.textContent = '🎁 Hediye Kahveyi Ver';
      } else {
        btn.className = 'add-btn';
        btn.textContent = '☕ Fincan Ekle';
      }

      document.getElementById('customer-card').classList.add('visible');
    }

    // ── Add cup ──────────────────────────────────────────────────────────────
    async function addCup() {
      if (!currentCustomer) return;
      const btn = document.getElementById('add-btn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/add-cup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerId: currentCustomer.id,
            baristaPin: baristaPin
          })
        });
        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || 'Hata oluştu', 'error');
        } else {
          currentCustomer = { ...currentCustomer, cups: data.cups };
          renderCustomer(currentCustomer);
          if (data.giftGiven) {
            showToast('🎉 Hediye verildi! Sayaç sıfırlandı', 'success');
          } else if (data.giftEarned) {
            showToast('🎉 Hediye kazanıldı!', 'success');
          } else {
            showToast('Fincan eklendi ✓', 'success');
          }
        }
      } catch {
        showToast('Bağlantı hatası', 'error');
      }

      btn.disabled = false;
    }

    // ── Register new ─────────────────────────────────────────────────────────
    async function registerNew() {
      try {
        const res = await fetch('/api/register', { method: 'POST' });
        const data = await res.json();
        currentCustomer = data;
        renderCustomer(data);
        showToast(`Yeni müşteri: ${data.id} (+3 yıldız)`, 'success');
      } catch {
        showToast('Kayıt hatası', 'error');
      }
    }

    // ── Toast ────────────────────────────────────────────────────────────────
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (type ? ' ' + type : '');
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    // Enter key on manual input
    document.getElementById('manual-id').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') lookupById();
    });
  </script>
</body>
</html>
