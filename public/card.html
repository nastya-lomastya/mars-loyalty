<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mars Cafe — Kartım</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #C8A96E; --dark: #1a1a1a; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #111;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 320px;
    }

    .loyalty-card {
      background: var(--dark);
      border-radius: 24px;
      padding: 1.75rem 1.5rem 1.75rem;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(200,169,110,0.12);
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }

    /* Logo */
    .card-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .card-logo img { width: 140px; height: auto; }

    /* 4x2 grid */
    .stars-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 1.5rem;
    }
    .star-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 28px;
      line-height: 1;
    }
    .star-cell.filled { color: var(--gold); }
    .star-cell.empty { color: rgba(255,255,255,0.12); }
    .star-cell.gift-waiting {
      border: 1.5px dashed rgba(200,169,110,0.4);
      color: rgba(200,169,110,0.35);
      font-size: 22px;
    }
    .star-cell.gift-earned {
      background: var(--gold);
      color: var(--dark);
      font-size: 22px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    .card-divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin-bottom: 1.1rem;
    }

    .counters-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }
    .counter-block { display: flex; flex-direction: column; gap: 3px; }
    .counter-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
    }
    .counter-value {
      font-size: 30px;
      font-weight: 700;
      color: white;
      line-height: 1;
      letter-spacing: -1px;
    }
    .counter-block.right { align-items: flex-end; }
    .counter-value.gold { color: var(--gold); }

    .qr-block {
      background: white;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #qrcode canvas, #qrcode img { border-radius: 4px; display: block; }
    .qr-id { font-size: 10px; color: #999; letter-spacing: 2px; }

    .state-loading, .state-error {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      padding: 4rem 0;
    }
    .state-error { color: #e87070; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading" class="state-loading">Yükleniyor...</div>
    <div id="error" class="state-error" style="display:none"></div>

    <div id="card-content" style="display:none">
      <div class="loyalty-card">
        <div class="card-logo">
          <img src="/mars_white.svg" alt="Mars Cafe">
        </div>

        <div class="stars-grid" id="stars-grid"></div>

        <div class="card-divider"></div>

        <div class="counters-row">
          <div class="counter-block">
            <div class="counter-label">Fincan</div>
            <div class="counter-value" id="cups-value">— / 7</div>
          </div>
          <div class="counter-block right">
            <div class="counter-label">Hediye</div>
            <div class="counter-value gold" id="gifts-value">0</div>
          </div>
        </div>

        <div class="qr-block">
          <div id="qrcode"></div>
          <div class="qr-id" id="qr-id-label"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOTAL = 8;
    const id = window.location.pathname.split('/').pop();
    let qrGenerated = false;

    async function loadCard() {
      try {
        const res = await fetch('/api/customer/' + id);
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderCard(data);
      } catch(e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Kart bulunamadı.';
      }
    }

    function renderCard(data) {
      const cups = data.cups, gifts = data.gifts || 0;
      const grid = document.getElementById('stars-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= TOTAL; i++) {
        const cell = document.createElement('div');
        if (i === TOTAL) {
          cell.className = 'star-cell ' + (cups >= TOTAL ? 'gift-earned' : 'gift-waiting');
          cell.innerHTML = '<i class="ti ti-gift"></i>';
        } else {
          cell.className = 'star-cell ' + (i <= cups ? 'filled' : 'empty');
          cell.innerHTML = '<i class="ti ti-coffee"></i>';
        }
        grid.appendChild(cell);
      }
      document.getElementById('cups-value').textContent = Math.min(cups,7) + ' / 7';
      document.getElementById('gifts-value').textContent = gifts;
      if (!qrGenerated) {
        document.getElementById('qr-id-label').textContent = data.id;
        new QRCode(document.getElementById('qrcode'), {
          text: window.location.origin + '/api/customer/' + data.id,
          width: 150, height: 150,
          colorDark: '#1a1a1a', colorLight: '#ffffff',
        });
        qrGenerated = true;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('card-content').style.display = 'block';
    }

    loadCard();
    setInterval(loadCard, 30000);
  </script>
</body>
</html>
