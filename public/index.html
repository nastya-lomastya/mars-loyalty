<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mars Cafe — Ödül Kartı</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #C8A96E; --gold-light: #E2C99A; --dark: #1a1a1a; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.07) 0%, transparent 55%);
      pointer-events: none;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo {
      margin-bottom: 1.75rem;
      margin-top: 0.5rem;
    }
    .logo img { width: 180px; height: auto; }

    /* Card preview */
    .card-preview {
      background: #222;
      border: 1px solid rgba(200,169,110,0.15);
      border-radius: 20px;
      padding: 1.5rem 1.25rem;
      width: 100%;
      margin-bottom: 1.75rem;
    }

    .preview-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1.25rem;
    }

    /* Preview cups 4x2 */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 1.25rem;
    }
    .pcell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 26px;
      color: rgba(255,255,255,0.12);
    }
    .pcell.gift {
      border: 1.5px dashed rgba(200,169,110,0.4);
      color: rgba(200,169,110,0.4);
      font-size: 20px;
    }

    .preview-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      line-height: 1.65;
    }
    .preview-desc strong { color: var(--gold-light); font-weight: 500; }

    /* CTA */
    .btn-register {
      width: 100%;
      padding: 15px;
      background: var(--gold);
      color: var(--dark);
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 1rem;
    }
    .btn-register:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-register:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .cta-note {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      line-height: 1.6;
    }

    /* Success */
    .success { display: none; text-align: center; animation: fadeIn 0.4s ease; width: 100%; }
    .success.visible { display: block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    .success-icon { font-size: 36px; color: var(--gold); margin-bottom: 0.75rem; }
    .success-title { font-size: 10px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 0.75rem; }
    .success-id {
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 3px;
      margin: 0.5rem 0 0.75rem;
      font-weight: 300;
    }
    .success-note { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 1.5rem; }
    .btn-view {
      display: inline-block;
      width: 100%;
      padding: 14px;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-view:hover { background: var(--gold); color: var(--dark); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="/mars_white.svg" alt="Mars Cafe">
    </div>

    <div id="main-content" style="width:100%">
      <div class="card-preview">
        <div class="preview-label">Ödül Kartı</div>
        <div class="preview-grid">
          <div class="pcell"><i class="ti ti-coffee"></i></div>
          <div class="pcell"><i class="ti ti-coffee"></i></div>
          <div class="pcell"><i class="ti ti-coffee"></i></div>
          <div class="pcell"><i class="ti ti-coffee"></i></div>
          <div class="pcell"><i class="ti ti-coffee"></i></div>
          <div class="pcell"><i class="ti ti-coffee"></i></div>
          <div class="pcell"><i class="ti ti-coffee"></i></div>
          <div class="pcell gift"><i class="ti ti-gift"></i></div>
        </div>
        <div class="preview-desc">
          7 fincan satın al, <strong>8. fincanı bedava</strong> al.<br>
          İstediğin kahve — hiçbir kural yok.
        </div>
      </div>

      <button class="btn-register" id="btn-register" onclick="register()">
        Kartımı Oluştur
      </button>
      <div class="cta-note">
        İsim, e-posta veya telefon gerekmez.<br>
        Kartın anonim ve güvenlidir.
      </div>
    </div>

    <div class="success" id="success">
      <div class="success-icon"><i class="ti ti-sparkles"></i></div>
      <div class="success-title">Kartın Hazır</div>
      <div class="success-id" id="success-id">—</div>
      <div class="success-note">
        Bu ID senin kartın. Kaydet veya ekran görüntüsü al.<br>
        Baristayla paylaşarak fincan ekletebilirsin.
      </div>
      <a href="#" id="view-card-link" class="btn-view">Kartımı Gör →</a>
    </div>
  </div>

  <script>
    async function register() {
      const btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.textContent = 'Oluşturuluyor...';
      try {
        const res = await fetch('/api/register', { method: 'POST' });
        const data = await res.json();
        if (data.id) {
          localStorage.setItem('mars_loyalty_id', data.id);
          document.getElementById('main-content').style.display = 'none';
          document.getElementById('success-id').textContent = data.id;
          document.getElementById('view-card-link').href = '/card/' + data.id;
          document.getElementById('success').classList.add('visible');
        }
      } catch(e) {
        btn.disabled = false;
        btn.textContent = 'Kartımı Oluştur';
        alert('Bir hata oluştu, tekrar dene.');
      }
    }
  </script>
</body>
</html>
